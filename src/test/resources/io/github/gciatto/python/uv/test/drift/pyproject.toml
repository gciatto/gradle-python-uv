[project]
name = "drift"
version = "0.1.0"
description = "Drift detection"
requires-python = ">=3.10"
# Renovate bumped this one, regeneration must keep it
dependencies = [
    "packaging>=26.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "mypy>=2.1.0",
    "poethepoet>=0.45.0",
    "pytest>=9.1.0",
    "ruff>=0.15.12",
]

[tool.uv.build-backend]
module-name = "drift"
module-root = ""

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.poe.tasks]
test = "pytest"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy drift"
compile = "python -m compileall -q drift"
static-checks = ["compile", "format-check", "ruff-check", "mypy"]
static-fixes = ["ruff-fix", "format"]
# a hand-written task, unknown to Gradle
docs = "python -c \"print('documentation generated')\""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build"]
