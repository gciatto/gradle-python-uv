tests:
  - description: "with python.uvProvisioning=ALWAYS, the pinned uv should be downloaded and used"
    configuration:
      tasks: [uvInstall, uvSync]
      options: [-Ppython.uvProvisioning=ALWAYS, --configuration-cache]
    expectation:
      success: [uvInstall, uvSync]
      # version-agnostic: the pinned uv version is updated by Renovate
      output_matches:
        - 'uv executable: .*python-uv[/\\]uv[/\\]\d+\.\d+\.\d+[/\\]'
        - '^\s*uv \d+\.\d+\.\d+'

  - description: "a missing explicit uv executable should be reported"
    configuration:
      tasks: [uvInstall]
      options: [-Ppython.uvExecutable=missing-uv-executable]
    expectation:
      failure: [uvInstall]
      output_contains: ["The configured uv executable 'missing-uv-executable' was not found"]
